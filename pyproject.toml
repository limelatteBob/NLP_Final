[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evotask"
version = "0.4.1"
description = "A minimal auditable multi-agent task workbench"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pypdf>=6,<7", "openpyxl>=3.1,<4", "defusedxml>=0.7,<1", "charset-normalizer>=3.4,<4", "striprtf>=0.0.29,<1"]
test-web = ["httpx>=0.27,<1", "playwright>=1.50,<2", "python-docx>=1.2,<2", "python-pptx>=1.0,<2"]

[project.scripts]
evotask = "evotask.cli:main"

[tool.setuptools.packages.find]
include = ["evotask*"]

[tool.setuptools.package-data]
evotask = ["web/static/*", "web/data/*"]
